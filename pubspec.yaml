name: gotosco_v3
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  supabase_flutter: ^2.12.0
  google_sign_in: ^6.2.2  # Using v6.x (v7.x has breaking changes)
  font_awesome_flutter: ^10.6.0 # Optional: For better brand icons if desired
  intl: ^0.20.2
  url_launcher: ^6.2.0  # Add this
  flutter_map: 8.2.2
  flutter_map_cancellable_tile_provider: ^3.0.2  # Better tile loading for web
  latlong2: ^0.9.0
  # GPS & Geocoding
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  # Permissions
  permission_handler: ^11.3.0
  http: ^1.6.0
  # Firebase & Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  table_calendar: ^3.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
